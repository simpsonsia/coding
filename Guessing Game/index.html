
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-container">
    <h1>Guess the Number!</h1>
    <p class="instructions">
      I'm thinking of a number between 1 and 100.
      Can you guess it?
    </p>

    <form id="guess-form">
      <label for="guess-input">Enter your guess:</label>
      <input
        type="number"
        id="guess-input"
        min="1"
        max="100"
        placeholder="Enter a number"
        required
      >
      <button type="submit" id="guess-button">Guess!</button>
    </form>

    <p id="message" aria-live="polite">
      Make your first guess!
    </p>

    <p>Attempts: <span id="attempts">0</span></p>
    <p>Best score: <span id="best-score">—</span></p>

    <button id="restart-button" type="button" hidden>
      Play Again
    </button>
  </main>
</body>
</html>
